name: trading-agent tests

# CI del trading agent: ejecuta la suite completa de pytest en cada push a
# main y en cada pull request que toque el proyecto. Los tests no usan red
# (datos sintéticos), así que el job es determinista.
on:
  push:
    branches: [main]
    paths: ["trading-agent/**", ".github/workflows/trading-agent-tests.yml"]
  pull_request:
    paths: ["trading-agent/**", ".github/workflows/trading-agent-tests.yml"]

# Mínimo privilegio: el job solo necesita leer el repositorio.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading-agent/requirements.txt

      - name: Install dependencies (torch CPU variant first, lighter for CI)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff==0.17.3

      - name: Lint (ruff)
        run: ruff check src scripts tests

      - name: Run test suite
        run: pytest -q

      - name: Run doctests (documented examples must stay true)
        run: pytest -q --doctest-modules src/trading_agent --ignore=src/trading_agent/data/bloomberg.py
